# asmfea diagnostics catalogue: every code, its wording and suggested actions.
#
# One table per code. `what` is a template filled from the diagnostic's `params`
# (Python str.format). `explain` is a longer plain-English paragraph for the task pane's help
# window. `likely_causes` are ranked, most probable first, and must not
# state a cause as certain unless the raising code proves it. `actions` are concrete
# next steps; an action with an `apply` key can be offered as a one-click fix.
#
# Adding a code: add it here, raise it with diagnostics.make(code, ...), and add a
# deliberately broken case in tests/test_diagnostics_cases.py that triggers it and
# checks its `where`.

[MODEL_FILE_MISSING]
severity = "blocking"
stage = "load"
what = "The study folder has no {file}."
explain = "Every run starts from the files the add-in exports into the study folder (model.json, study.json and one STEP file per part). One of them is not there, so nothing can be analysed. Exporting again from the AsmFEA pane (Run tab, Export or Run all) normally rewrites it."
likely_causes = ["The model was never exported into this folder.", "The folder path points at the assembly folder instead of a study folder."]
actions = ["Run Export from the add-in (or `asmfea extract`) for this study.", "Check the study folder path: it should be <Assembly>_FEA/<study>/."]

[MODEL_SCHEMA_INVALID]
severity = "blocking"
stage = "load"
what = "{file} does not match the neutral-model schema: {detail}"
explain = "The exported files follow a fixed format so that SolidWorks and the analysis agree on what everything means. This file breaks that format, usually because it was edited by hand or written by a different version of the add-in. Export again; if it persists, the detail names the offending field."
likely_causes = ["A hand edit to study.json introduced a typo or a wrong type.", "The file was written by a newer or older add-in."]
actions = ["Fix the field named in the message.", "Re-export the model from the add-in."]

[MODEL_REFERENCE_UNKNOWN]
severity = "blocking"
stage = "load"
what = "{kind} '{ref}' used by {owner} is not defined in the model."
explain = "Something in the study points at an item (a part, face, material or load case) that is not defined. Nothing is guessed: the run stops so a load or fixture cannot silently land in the wrong place. This usually follows deleting a part or face that a load still used; edit or delete that load in the pane."
likely_causes = ["A face, part or material was renamed or removed after the load or fixture was defined.", "A typo in study.json."]
actions = ["Redefine the load or fixture on the current geometry.", "Correct the id in study.json."]

[MATERIAL_MISSING]
severity = "blocking"
stage = "load"
what = "Part {part} has no material properties ('{material}')."
explain = "Stiffness and strength come from the part's material. This part has none, or its material lacks the elastic modulus, Poisson's ratio or density the analysis needs. Assign a material in SolidWorks (Edit Material) and export again; a custom material must define those properties."
likely_causes = ["No material is assigned to the part in SolidWorks.", "The material is not in the material list exported with the model."]
actions = ["Assign a material to the part in SolidWorks and re-export.", "Add the material with E, nu, density and yield to the model's materials."]

[LOAD_CASE_UNDEFINED]
severity = "blocking"
stage = "load"
what = "Load case '{case}' {problem}."
explain = "Loads are grouped into named load cases, each solved separately. A load names a case the study does not list, or a listed case has no loads. Check the load cases and their loads on the Loads tab."
likely_causes = ["The load case was renamed in the study but not on its loads.", "A load case was added to the study with no loads yet."]
actions = ["Assign loads to the load case or remove it from the study."]

[NO_FIXTURES]
severity = "blocking"
stage = "load"
what = "The study has no fixtures, so nothing holds the assembly in space."
explain = "A static analysis needs something holding the assembly in space; without it the whole model would simply fly away under load and the solver cannot find an answer. Add at least one fixture (select faces, then Fixed or Pinned on the Loads tab)."
likely_causes = ["Fixtures have not been defined yet."]
actions = ["Add at least one fixture to a face of the assembly."]

[STEP_MISSING]
severity = "blocking"
stage = "geometry"
what = "The STEP file {step} for part {part} is missing or unreadable."
explain = "Each part's geometry is passed to the mesher as a STEP file written by the add-in. This one is missing or cannot be read, so the part cannot be meshed. Export again; if SolidWorks reported an export problem, that message explains why."
likely_causes = ["The export was interrupted.", "The file was moved or deleted."]
actions = ["Re-export the model."]

[BODY_UNMATCHED]
severity = "blocking"
stage = "geometry"
what = "Part {part} could not be matched to a solid in {step}."
explain = "The add-in describes each part's solid (volume, area, size) so it can be found again in the STEP file. No solid in the file matches, usually because the part changed after the export or the file belongs to another configuration. Export again."
likely_causes = ["The STEP export changed the body (healing, merged faces).", "The part's descriptors were written for a different configuration."]
actions = ["Re-export the model.", "Open the STEP file and check the body is present and closed."]

[BODY_VOLUME_DIFFERS]
severity = "warning"
stage = "geometry"
what = "Part {part}: the solid read from {step} has a volume {percent} % different from SolidWorks'."
explain = "The body was found in the STEP file by its size and position, which match. Its volume as computed from the STEP file differs from the volume SolidWorks reports, usually because the export converted some faces approximately. The analysis uses the STEP solid, so its stiffness and mass follow that volume."
likely_causes = ["Faces converted approximately in the STEP export (imported or derived bodies, complex surfaces).", "A body with a defect (a gap or a reversed face) that SolidWorks tolerates."]
actions = ["Check the part's mass on the Results tab against SolidWorks' Mass Properties.", "If it matters, repair the body in SolidWorks (Check, Import Diagnostics) and export again."]

[BODY_AMBIGUOUS]
severity = "blocking"
stage = "geometry"
what = "Part {part} matches {count} solids in {step} equally well."
explain = "The part's STEP file holds several solids that all match the description equally well, so the tool cannot tell which one is meant. It will not guess. This happens with multibody parts made of identical bodies; make the bodies different or split them into separate parts."
likely_causes = ["The STEP file holds several identical bodies in the same position.", "A body is duplicated in the part."]
actions = ["Remove the duplicate body in SolidWorks and re-export."]

[FACE_UNMATCHED]
severity = "blocking"
stage = "geometry"
what = "Face {face} on part {part} matches no face of the part's geometry."
explain = "Loads, fixtures and mates refer to faces by their shape and position. This face no longer matches any face of the part, so whatever was applied to it has nowhere to go. Usually the part changed since the face was picked; reselect the face for that load or fixture."
likely_causes = ["The geometry changed since the load or fixture was placed.", "The face was split or merged by the STEP export."]
actions = ["Re-select the face for the load or fixture.", "Re-export the model."]

[FACE_AMBIGUOUS]
severity = "blocking"
stage = "geometry"
what = "Face {face} on part {part} matches {count} faces equally well."
explain = "Several faces of the part match this face's shape and position equally well (for example identical holes in a pattern), so the tool cannot tell which one was meant and will not guess. Reselect the face, or make the faces distinguishable."
likely_causes = ["The part is symmetric and the face fingerprint cannot tell the candidates apart."]
actions = ["Re-select the face so its fingerprint is stored again.", "Split the face in SolidWorks so the target is unique."]

[PART_FLOATING]
severity = "blocking"
stage = "resolve"
what = "{count} part(s) have no connection path to a fixture: {parts}."
explain = "These parts are not connected to anything that leads back to a fixture: no touching faces, mates or bolts tie them in. A floating part has no stiffness, so the solver cannot find an answer. Look for small gaps between parts, or set the connection yourself on the Connections tab."
likely_causes = ["The parts do not touch anything within the gap tolerance.", "A connection was set to 'none' by an override."]
actions = ["Check the listed parts touch their neighbours, or add a fixture to them.", "Review overrides that remove connections to these parts."]

[PART_EXCLUDED_DISCONNECTED]
severity = "warning"
stage = "resolve"
what = "{count} part(s) are not connected to anything with a fixture and are left out of the analysis: {parts}."
explain = "These parts have no path, through touching faces, mates or bolts, to a fixture, and no load is applied to them, so they cannot carry anything. They are left out so the rest of the model can be solved; their weight is not included. Click this message to select them in SolidWorks. If they should be part of the structure, look for small gaps, or set the connection on the Connections tab."
likely_causes = ["A gap between the parts and their neighbours larger than the bond tolerance.", "Duplicate or stray bodies left in a part.", "A connection set to 'none' by an override."]
actions = ["Select the parts from this message and check how they meet their neighbours.", "Raise the bond tolerance on the Connections tab if the gaps are intended to be bonded."]

[MECHANISM_LOADED]
severity = "blocking"
stage = "resolve"
what = "{parts} carry load ({loads}) but are free to move: {motions}. Leaving them out would lose the load."
explain = "Parts that nothing holds in some direction are normally left out (they would only move out of the way of a load). These carry a load, so leaving them out would quietly drop it: the run stops instead."
likely_causes = ["A hinge or sliding joint where the parts are really fixed together.", "A missing fixture or connection: the part is held in reality by something not in the model.", "A load put on the wrong part."]
actions = ["If the part should not turn on its concentric mate, set the mate to lock rotation in SolidWorks (Lock rotation in the mate's options) and analyse the connections again.", "Or hold it another way: set its connection to Fixed (Connections tab, Edit), or add a fixture.", "If the load belongs elsewhere, move it to the part that carries it."]

[PART_EXCLUDED_MECHANISM]
severity = "warning"
stage = "resolve"
what = "The assembly is not fully constrained: {count} part(s) are free to move and are left out of the analysis: {parts} ({motions}). Loads on them, not carried: {loads}."
explain = "These parts can move without straining anything, for example a part held only by a hinge that nothing stops turning. Under a load they would just move out of the way, so they carry nothing: they are left out so the rest of the model can be solved, and their loads and weight are not included. Click this message to select them in SolidWorks. If they should carry load, add a fixture, another connection, or lock the hinge's rotation."
likely_causes = ["A part on a hinge (concentric mate) with nothing else holding it.", "A sliding joint with nothing stopping the slide.", "A connection set to 'none' or 'sliding, no separation' that was the part's only hold."]
actions = ["Select the parts from this message and check how they should be held.", "If the parts should not turn, set their concentric mate to lock rotation in SolidWorks (Lock rotation in the mate's options), or tick Lock rotation on a hinge you added, and analyse the connections again.", "Add a fixture or a connection that stops the named motion."]

[LOAD_HYDROSTATIC_DRY]
severity = "warning"
stage = "solve"
what = "Hydrostatic load {load} puts no pressure on its faces: they are all above the top of the fluid, and the pressure over the fluid is 1 atmosphere."
explain = "A hydrostatic load presses on the selected faces that lie below the top of the fluid, more deeply the further down they are (along the fluid's down direction). The top of the fluid is the faces' centre moved by the offset you gave. Here every face is above it, so the load does nothing. 1 atmosphere over the fluid is taken to be balanced by the air outside."
likely_causes = ["The offset to the top of the fluid points the wrong way (down instead of up).", "The down direction is reversed: SolidWorks' up is usually +Y, so down is 0, -1, 0.", "The wrong faces were selected."]
actions = ["Edit the load: set the top of the fluid above the faces, and check the down direction."]

[LOAD_ON_FLOATING_PART]
severity = "blocking"
stage = "resolve"
what = "Load {load} is applied to part {part}, which has no path to a fixture."
explain = "A load is applied to a part that is not connected, through any chain of parts, to a fixture. The load has nowhere to go. Connect the part (check for gaps, or set a connection on the Connections tab) or move the load."
likely_causes = ["The part is not connected to the rest of the assembly."]
actions = ["Connect the part, or move the load."]

[MESH_PART_FAILED]
severity = "blocking"
stage = "mesh"
what = "Part {part} could not be meshed by any mesher in the fallback chain."
explain = "Every mesher in the chain tried this part and none produced a usable mesh. Common causes are very small features, sliver faces, or geometry that does not close into a solid. Simplify or repair the part in SolidWorks (Check, small fillets, tiny edges) and run again."
likely_causes = ["The geometry has tiny faces, slivers or self-intersections.", "The element size is too large for a thin feature of the part."]
actions = ["Open the part's STEP file in PrePoMax and inspect the geometry.", "Set a finer mesh size for the study.", "Defeature small details (fillets, text, cosmetic holes) in SolidWorks."]

[MESH_INVERTED]
severity = "blocking"
stage = "mesh"
what = "Part {part} has {count} inverted or flat elements after meshing."
explain = "Some elements in this part's mesh are turned inside out, or flat (no volume at all). Results from such elements are meaningless, and a flat element's stiffness swamps the rest of the part, so the run stops. It usually comes from distorted geometry such as very thin slivers or knife edges; simplify those regions or choose a different mesh fidelity."
likely_causes = ["Curved second-order nodes on small radii folded over the element.", "The mesher closed a gap between two triangulations of a face with a flat element."]
actions = ["Set a finer mesh size.", "Remove small fillets from the part."]

[SOLVER_NOT_FOUND]
severity = "blocking"
stage = "solve"
what = "The CalculiX solver was not found at '{path}'."
explain = "The analysis is solved by CalculiX, a separate program the tool runs. It is not at the path given in asmfea.toml (in %APPDATA%\\asmfea). Install it (it ships with PrePoMax) and point the [solver] entry at ccx_dynamic.exe."
likely_causes = ["asmfea.toml does not point at ccx.", "The CalculiX installation was moved."]
actions = ["Set [solver] ccx in asmfea.toml to the full path of the CalculiX executable (e.g. the one shipped in PrePoMax's Solver folder)."]

[SOLVE_SINGULAR]
severity = "blocking"
stage = "solve"
what = "Free body motion: part of the model is not held and can move without resistance{detail}."
explain = "One or more parts are insufficiently constrained: they can move as a mechanism (turn on their hinges, slide, or float), so the solve has no single answer. The part named is the one that moved furthest; the parts joined to it move with it. A folding or hinged assembly needs something to hold it in the position analysed: a fixture, a locked hinge, or a connection that stops the motion."
likely_causes = ["A part or group of parts is not held against rigid-body motion.", "A connection that should transfer load is missing or set to 'none'."]
actions = ["Hold the named part and the parts moving with it: add a fixture, lock a hinge (Lock rotation), or set a connection that stops the motion to Fixed.", "If the assembly is meant to move (a linkage), model the stop or actuator that holds it in the position analysed."]

[SOLVE_FAILED_UNKNOWN]
severity = "blocking"
stage = "solve"
what = "CalculiX stopped with an error this tool does not recognise (exit code {exit_code})."
explain = "CalculiX stopped with an error this tool does not recognise. The raw solver output below shows what it reported. Running the study again rarely helps; open the deck in PrePoMax (Results tab) or send the study folder for investigation."
likely_causes = []
actions = ["Read the log excerpt in `raw`.", "Open the run in PrePoMax to inspect the model (`asmfea prepomax`)."]

[SOLVE_OUT_OF_MEMORY]
severity = "blocking"
stage = "solve"
what = "The solver ran out of memory on a model with {dof} degrees of freedom."
explain = "The model has more unknowns than the computer's memory can hold while solving, even after AsmFEA's own retry with the simplest joints. On the Run tab (How to solve) choose Optimise for: Speed (a coarser mesh, one solve), close other programs, or remove detail that does not matter for strength."
likely_causes = ["The mesh is too fine for the installed RAM.", "Other programs took memory during the run."]
actions = ["Choose Optimise for: Speed on the Run tab (How to solve) (or a coarser mesh level under Advanced).", "Close other programs before running.", "Reduce the number of parts meshed with tets (members and flat sheet use swept elements)."]

[HYBRID_RETRIED]
severity = "info"
stage = "solve"
what = "The hybrid solver ran out of memory after {minutes:.0f} min with exact joints, so it solved again with smoother joints, one part at a time."
explain = "AsmFEA joins parts exactly where the joints are small enough (as CalculiX does), which is the most accurate. On this model, with the memory free at the time, that ran out of memory, so instead of stopping the run AsmFEA solved again joining every part by smooth fields, one part at a time. The results are complete; joints by smooth fields can be up to 10 % too flexible at welded frame joints, and the accuracy grade says so."
likely_causes = ["Many or large joints for the memory free at the time.", "Other programs took memory during the run."]
actions = ["Accept the results (see the accuracy grade).", "For exact joints, close other programs and run again, or run on a computer with more memory."]

[SOLVE_MEMORY_EXCEEDS_RAM]
severity = "blocking"
stage = "solve"
what = "The model is too large to solve here: about {need_gb:.0f} GB of memory for {dof:,} unknowns, on a computer with {ram_gb:.0f} GB."
explain = "The solver would need more memory than this computer can give it, so it would swap to disk and slow the whole computer to a standstill. It is not started. Large counts usually come from a part meshed far finer than it needs: look for a warning that a part was meshed with tetrahedra instead of being swept, and the mesh line on the Run tab."
likely_causes = ["A thin part was meshed with small tetrahedra (a sweep was refused).", "The mesh fidelity is fine for a large model."]
actions = ["Use a coarser mesh fidelity.", "Simplify the part named in a mesh fallback warning (e.g. remove a small recess or step), or suppress parts that do not matter."]

[SOLVER_HYBRID]
severity = "info"
stage = "solve"
what = "Solved with AsmFEA's hybrid solver, not CalculiX: {dof:,} unknowns would need about {need_gb:.0f} GB in CalculiX on a computer with {ram_gb:.0f} GB. The hybrid solver used {peak_gb:.1f} GB."
explain = "CalculiX solves the whole model at once and would not fit in this computer's memory. The hybrid solver solves each part on its own and joins them through their interfaces, so it needs only about the largest part's memory. Its joints are smooth fields over each interface rather than node-by-node ties: in tests it agreed with CalculiX within about 1-3 % on displacement and on stresses away from joints, with exact reactions. Peak stresses right at a joint can differ more."
likely_causes = ["A large model: many parts or a fine mesh.", "A part meshed finer than it needs (look for a mesh fallback warning)."]
actions = ["Nothing is required: the results are valid for a linear static study.", "To solve with CalculiX instead, use a coarser mesh fidelity or simplify the model until it fits, or run on a computer with more memory."]

[MEMORY_ESTIMATE_HIGH]
severity = "info"
stage = "solve"
what = "Estimated solver memory {need_gb:.1f} GB exceeds {frac:.0%} of installed RAM ({ram_gb:.1f} GB)."
explain = "The solver is expected to need a large share of the computer's memory. The run continues, but the computer may slow down badly or the solve may fail. Consider a coarser mesh, or close other large programs while it runs."
likely_causes = ["The mesh is fine for the size of the model."]
actions = ["Use a coarser mesh fidelity before solving."]

[MEMORY_PRESSURE]
severity = "info"
stage = "solve"
what = "Other programs have taken {taken_gb:.1f} GB of memory since this run started ({available_gb:.1f} GB now free): the solve is continuing, but may be slower."
explain = "When the run started, AsmFEA measured the free memory and planned the solve to fit it, leaving room for SolidWorks and other programs. Since then other programs have taken more, so parts of the solve are waiting their turn or being moved to the page file. The run is not stopped and its results are not affected; it just takes longer. Closing programs you do not need speeds it up again."
likely_causes = ["Another program (a browser, another SolidWorks document, a second analysis) was opened or grew during the run.", "SolidWorks itself grew while you kept working in it."]
actions = ["Close programs you do not need (browsers, other SolidWorks documents) to give the solve its memory back.", "Leave the run going: it will finish, more slowly."]

[REACTION_IMBALANCE]
severity = "warning"
stage = "post"
what = "Reaction totals differ from the applied load by {err:.2%} in load case {case}."
explain = "The forces at the fixtures should add up to the loads applied. Here they differ by more than round-off, which means some load is being lost or carried somewhere unexpected (for example by a joint or stabilising spring). Treat the results with caution until the cause is understood."
likely_causes = ["Part of the load acts on a surface that is not connected to the fixtures.", "Ties or couplings lose load because of a large position tolerance."]
actions = ["Check the connection table for gaps near the loaded parts."]

[JOB_STALLED]
severity = "blocking"
stage = "job"
what = "Job {job} has not updated for {age:.0f} s and its worker process is not running."
explain = "The background job stopped reporting progress and its worker process is gone, usually because it was killed or the computer slept. Start the run again."
likely_causes = ["The worker process was killed or the machine went to sleep."]
actions = ["Start the run again."]

[JOB_FAILED]
severity = "blocking"
stage = "job"
what = "Job {job} failed in stage {stage_failed} with an unexpected error: {error}"
explain = "The analysis hit an unexpected internal error. This is a fault in the tool rather than in your model. The error text and the job folder help find the cause; running again after a change to the model may avoid it."
likely_causes = ["A defect in asmfea."]
actions = ["Send the job folder (job.json and log.txt) for investigation."]

[FEATURE_NOT_IMPLEMENTED]
severity = "blocking"
stage = "deck"
what = "The study uses {feature}, which this version of asmfea does not support yet."
explain = "The study asks for something this version of AsmFEA cannot analyse yet. It stops rather than quietly leaving it out. Remove or change that item, or wait for the release that adds it."
likely_causes = ["The feature is scheduled for a later milestone."]
actions = ["Replace it with a supported equivalent, or remove it from the study."]

[DISPLACEMENT_LARGE]
severity = "warning"
stage = "post"
what = "Load case {case}: maximum displacement {disp:.3g} mm is {frac:.1%} of the model size; linear analysis may not be valid."
explain = "The analysis is linear: it assumes deflections are small compared with the parts. Here the largest deflection is a noticeable fraction of the model's size, so that assumption is doubtful and real behaviour may differ (stiffening, buckling or large rotation). Check the loads and units, then treat the results with care."
likely_causes = ["The structure is much more flexible than intended (missing member or connection).", "Loads are larger than intended (units or magnitude)."]
actions = ["Check the load magnitudes.", "Check the connection table for missing ties near the part that moves most."]

[RESULTS_MISSING]
severity = "blocking"
stage = "post"
what = "There is no solved run to post-process in this study."
explain = "There are no solver results to process yet. Run the whole study (Run all) rather than only the later stages."
likely_causes = ["The solve stage has not been run, or it failed."]
actions = ["Run the solve stage first (asmfea run <study> --stages solve post)."]

[DECK_CARD_REJECTED]
severity = "blocking"
stage = "solve"
what = "CalculiX could not interpret the deck card '{card}' and produced no results."
explain = "CalculiX could not understand one of the instructions in the input file this tool wrote, and it produced no results. This is a fault in the tool, not in your model; the raw output names the instruction."
likely_causes = ["A defect in asmfea's deck writer (a keyword or option this CalculiX version does not accept)."]
actions = ["Send the run folder (study.inp, ccx.log) for investigation.", "Open the run in PrePoMax to inspect the deck."]

[MECHANISM]
severity = "blocking"
stage = "resolve"
what = "The model is a mechanism: {count} free motion(s) without straining anything. {motions}."
explain = "Checked before meshing: some parts can move freely without stretching anything, for example a part on a sliding joint with nothing stopping the slide, or parts touching only through contact. The solver could not find an answer. The listed motions show what is free; add a fixture or change a connection on the Connections tab."
likely_causes = ["A concentric mate lets parts turn that are really fixed together: AsmFEA makes it a hinge.", "A joint (revolute, sliding, line contact) leaves a motion that no fixture or other connection stops.", "A fixture constrains too few directions.", "Two parts are joined only along a line, which acts as a hinge."]
actions = ["If the named parts should not turn on their concentric mate, set the mate to lock rotation in SolidWorks (Lock rotation in the mate's options) and analyse the connections again; or set the connection to Fixed (Connections tab, Edit).", "Add a fixture that stops the named motion.", "Check the other mates on the named parts."]

[INTERFERENCE]
severity = "warning"
stage = "resolve"
what = "{parts} overlap by {volume:.3g} mm^3."
explain = "Two parts overlap in the model. Overlapping material cannot be meshed correctly and is not connected. It is usually a modelling error; use Interference Detection in SolidWorks and remove the overlap."
likely_causes = ["A press fit or a modelling error leaves the solids interpenetrating."]
actions = ["Remove the interference in SolidWorks.", "Or record a decision to tie the parts."]

[LINE_CONTACT]
severity = "warning"
stage = "resolve"
what = "{parts} touch only along a line or at a point ({kind}); no connection is made."
explain = "Two parts touch only along a line or at a point (for example a cylinder lying on a flat face). A connection over a line would concentrate all the force there and give meaningless stresses, so none is made. If the parts are bonded in reality, model a contact face; otherwise set the connection on the Connections tab."
likely_causes = ["A round part rests on a flat or round part with no area contact."]
actions = ["Decide the connection: none, tie or contact.", "Add a fixture or a mate that defines the joint."]

[MATE_CONFLICT]
severity = "warning"
stage = "resolve"
what = "{parts} touch, but their mates ({mates}) say they can move; no connection is made."
explain = "The parts touch, but their mates allow them to move relative to each other, so it is not obvious whether they should be joined. No connection is made. Decide on the Connections tab (Fixed, Sliding with friction, Sliding joint or Not connected)."
likely_causes = ["The parts are a mechanism in SolidWorks but should be fixed together for analysis.", "The touching faces are incidental."]
actions = ["Decide the connection for this interface (tie, contact or none)."]

[JOINT_WITHOUT_CONTACT]
severity = "warning"
stage = "resolve"
what = "{parts} are mated as a {joint} joint ({why}) but no touching faces were found."
explain = "The mates describe a joint (a hinge or slide) between these parts, but the parts have no touching faces for the joint to act through. Check the parts actually meet (for example a pin in a hole of the same size)."
likely_causes = ["The joint has clearance larger than the gap tolerance.", "The mated faces are not the load path."]
actions = ["Close the clearance in SolidWorks or record a decision for this pair."]

[HINGE_FACES_INVALID]
severity = "blocking"
stage = "resolve"
what = "Hinge {hinge} cannot be made: {problem}."
explain = "A hinge you add joins concentric cylindrical faces (holes, or a pin's surface) in two or more parts; each part turns about their common axis. The faces chosen for this hinge do not allow that, so it is left out until it is fixed."
likely_causes = ["A flat face or an edge was picked with the holes.", "The holes are not on one axis.", "All the faces are on one part.", "A face has changed in SolidWorks since the hinge was added."]
actions = ["Delete the hinge on the Connections tab and add it again, choosing only the concentric holes or pin surfaces in two or more parts."]

[HINGE_DUPLICATE]
severity = "info"
stage = "resolve"
what = "Hinge {hinge} is on the same axis and parts as the newer hinge {kept}, so the newer one is used and {hinge} is left out."
explain = "One hinge on an axis is all a joint needs. When a hinge is added again on the same axis (for example to change whether its rotation is locked), the one added last is the one used."
likely_causes = ["Add hinge was clicked more than once on the same joint."]
actions = ["Nothing to do: the older hinge is not used, and the task pane deletes it from the study. It is logged, not listed as an exception."]

[MATE_COUPLING_UNUSED]
severity = "warning"
stage = "resolve"
what = "The {kind} mate {mate} is not used: AsmFEA needs {missing}."
explain = "Gear and rack and pinion mates couple the turning (or sliding) of two parts, each of which must be free on its own joint: a hinge from a concentric mate for a gear or pinion, a sliding joint for a rack. This mate could not be used, so the parts it joins are not coupled: a part left free to turn is then left out of the analysis with a warning, and its teeth carry nothing."
likely_causes = ["The mate was made on edges or faces the add-in could not trace.", "SolidWorks 2018 does not give add-ins the gear ratio or rack travel.", "The mate names a straight edge for a gear."]
actions = ["Make the mate on the gears' cylindrical faces or circular edges.", "Lock the gear's hinge (Lock rotation on its concentric mate) if it should not turn."]

[MATE_COUPLING_HELD]
severity = "info"
stage = "resolve"
what = "{held} cannot move, so the {mate} mate holds {part} as well: it is analysed locked."
explain = "A gear or rack and pinion mate couples the turning (or sliding) of two parts. Here one of them has no free joint: it is bonded to its neighbours (AsmFEA bonds touching faces unless a mate or your choice frees them), so the coupling locks the other one too. In SolidWorks it may move, because SolidWorks only positions parts. If it should move, give it a joint: a sliding joint for a rack (Connections tab, Sliding joint, along the rack), or a hinge (a concentric mate) for a gear."
likely_causes = ["A rack resting on a guide with only a coincident mate: its faces are bonded.", "A gear fixed to its shaft or held by a fixture."]
actions = ["Set the held part's touching connection to a sliding joint along its travel, or give it a hinge.", "Leave it if the mechanism is meant to be locked in this analysis."]

[FASTENER_NO_HOLES]
severity = "warning"
stage = "resolve"
what = "Fastener {part} passes through holes in {count} part(s); a bolted joint needs at least two."
explain = "A fastener needs to pass through holes in at least two parts to form a bolted joint. This one does not, so it is not treated as a bolt. Check the fastener's position and that the holes line up."
likely_causes = ["The fastener is not seated in its holes.", "The holes are larger than 1.5 x the fastener diameter.", "The fastener's axis or diameter was exported wrongly."]
actions = ["Check the fastener's position and the hole sizes."]

[CONTACT_ONLY_SUPPORT]
severity = "warning"
stage = "resolve"
what = "Part {part} is held only by separating contact; it has no stiffness until the contact closes."
explain = "A separating contact only carries load once the faces press together; until then the part has no stiffness at all and the solver cannot start. To get going, the analysis adds very weak springs holding the part in place, and checks after the solve that they carried almost none of the load. If the part is pressed into its support by the loads this is fine; if not, keep one connection fixed or use a sliding joint."
likely_causes = ["Every connection to the part was switched to contact."]
actions = ["Keep at least one tie, or accept the weak stabilising springs the deck will add (stated in the report)."]

[MESH_SIZE_REDUCED]
severity = "info"
stage = "mesh"
what = "Part {part} would not mesh at its normal element size and was meshed at {factor} x that size ({size} mm)."
explain = "The mesher could not mesh this part at the size its fidelity asks for, usually because the part has small features (short edges, slivers, thin faces) that larger elements cannot follow. Smaller elements were used for this part only, so the run goes on; its mesh is finer than its neighbours', which costs time but not accuracy."
likely_causes = ["Small features in the part (short edges, slivers, tiny faces), often from an imported or converted body.", "A STEP export that approximated some faces."]
actions = ["Nothing is needed for the results.", "If the run is slow, simplify the part (remove tiny features) or repair it in SolidWorks (Check, Import Diagnostics)."]

[MESH_SWEEP_FALLBACK]
severity = "info"
stage = "mesh"
what = "Part {part}: {regions} could not be swept through the wall and were meshed with tets instead ({reason})."
explain = "Thin walls and members are normally meshed with layers of elements swept through the thickness, which bend accurately. Some regions of this part could not be swept and were meshed with tetrahedra instead, which are stiffer in thin-wall bending. Results are still produced; local stresses in those regions are less accurate."
likely_causes = ["The wall thickness is not constant (bosses, ribs, tapered or machined regions).", "The member's cross-section changes inside a clean span."]
actions = ["Check the part is meant to be thin-walled: tets in thin walls are stiffer in local wall bending (milestone 0: up to 3.6 times at one element per thickness).", "Choose a finer mesh (fidelity fine) if local stresses in this part matter."]

[MESH_TIMEOUT]
severity = "info"
stage = "mesh"
what = "The {mesher} mesher did not finish part {part} within {seconds:.0f} s and was stopped; the next mesher in the chain was tried."
explain = "One mesher took too long on this part and was stopped; the next mesher in the chain was used instead. The run continues. If it happens often, the part may have detail that is hard to mesh."
likely_causes = ["The part is large or detailed for the element size.", "The geometry makes the mesher loop (tiny faces, near-degenerate edges)."]
actions = ["Check whether a later mesher succeeded (the mesh stage result).", "Defeature small details or set a coarser mesh size for the part."]

[MESH_FACETS_UNTAGGED]
severity = "warning"
stage = "mesh"
what = "{count} boundary facets of part {part} lie on no CAD face within tolerance."
explain = "Some of the mesh surface on this part could not be matched back to a CAD face. Loads or fixtures on the affected faces may cover slightly less area than intended."
likely_causes = ["The mesher moved boundary nodes off the CAD surface (healing or a tessellation-based mesher).", "The body file and the mesh come from different geometry."]
actions = ["Check the faces used by loads, fixtures and connections still have facets (the solve stage fails if one has none).", "Re-run the mesh stage; report the part if it persists."]

[STRESS_SINGULAR]
severity = "info"
stage = "post"
what = "The peak stress in {parts} rose by more than {rise:.0%} on the finer mesh while the deflection settled: a singular point, not a real stress."
explain = "Each run solves on a base mesh and a finer one. Here the deflection hardly changed but the peak stress kept rising, the signature of a stress singularity: a sharp corner, or the end of a bonded edge, where linear analysis gives a stress that grows without limit as the mesh is refined. That number is not a real stress, so a factor of safety from it is a warning, not a fail. Read the stress a little away from that point, and check the joint (e.g. the weld) separately."
likely_causes = ["A sharp corner or a bonded edge ending at a corner (no fillet modelled).", "A plate edge bonded to a tube's corner radius."]
actions = ["Look at the stress plot away from the marked point.", "Add a fillet in the model if the corner matters, or check the weld or joint by hand."]

[CONVERGENCE_POOR]
severity = "warning"
stage = "post"
what = "Results changed by up to {worst:.1%} between the base and refined meshes (limit {tol:.0%}) in: {parts}."
explain = "Each run solves on a base mesh and a finer one and compares the deflections and the assessed stress (membrane plus bending, as the factor of safety uses). These parts changed by more than the limit, so their results depend noticeably on the mesh and may not be accurate yet. Use a finer fidelity if the study is not on the finest already, or look at where the change is (a joint or notch with large elements next to it, or a sharp corner)."
likely_causes = ["The base mesh is too coarse for these parts (thin walls, small fillets, stress concentrations).", "The peak sits on a singular point (sharp re-entrant corner or fixture edge) that never converges."]
actions = ["If the study is not on the finest mesh yet, optimise for Accuracy and run again; if it is, allow for the change shown before relying on a small margin in these parts.", "Check where the stress is: a sharp corner or fixture edge is a singularity (a fillet in the model settles it), not a real stress."]

[REFINE_MESH_FAILED]
severity = "info"
stage = "solve"
what = "{count} of the {chosen} parts chosen for the refined mesh could not be meshed finer and kept their base mesh: {parts}."
explain = "A large model is refined only on its most stressed parts, chosen after the base solve. These parts were chosen, but their finer mesh failed, so the refined solve used their base mesh again. Their convergence check then compares a mesh with itself and shows no change, which says nothing about their accuracy. Treat their results as base-mesh results."
likely_causes = ["The part's geometry (its STEP file) was moved or deleted during the run.", "The finer mesh failed where the base one succeeded (a thin feature at the smaller size)."]
actions = ["Check that the study's parts folder is complete and run again.", "If it fails again, see the part's mesh log in the job folder."]

[BUCKLING_NO_SCALED_LOAD]
severity = "blocking"
stage = "deck"
what = "Buckling case {case} has no load that the buckling factor can scale; all its loads are preloads."
explain = "A buckling factor says how many times the load can grow before the structure buckles. This case marks every load as a preload (held constant), so there is nothing to scale. Make at least one load in the case a scaled load."
likely_causes = ["The load case holds only self-weight, which is applied as a preload by default.", "Every load in the case has scale_in_buckling set to false."]
actions = ["Add the load that should be scaled to the case, or set scale_in_buckling true on a load."]

[BUCKLING_FACTOR_LOW]
severity = "warning"
stage = "post"
what = "Buckling case {case}: lowest buckling factor {factor:.3g} is below 1 or negative."
explain = "A buckling factor below 1 means the structure is predicted to buckle before reaching the applied load; a negative factor means it would buckle if the load were reversed. Below 1 is a failure unless the load is reversed in reality."
likely_causes = ["The structure buckles before the applied load is reached.", "A negative factor means buckling under the reversed load; the preload may be destabilising."]
actions = ["Check the load magnitudes and the restraint of slender members.", "Treat any factor below the study limit as a failure; linear buckling factors are upper bounds."]

[JOINT_AXIS_UNKNOWN]
severity = "blocking"
stage = "deck"
what = "The {joint} joint between {parts} has no axis or direction: no cylindrical interface and no mate direction."
explain = "A hinge or sliding joint needs a direction to turn about or slide along. None could be found: the parts do not meet on a cylinder and no mate gives a direction. On the Connections tab choose Sliding joint and pick the direction, or change the connection."
likely_causes = ["The joint was classified from mates whose geometry was not exported with a direction.", "The parts touch only on flat faces."]
actions = ["Mate the parts with a concentric or slot mate on a cylindrical face, or decide the connection as a tie."]

[TIE_EMPTY]
severity = "warning"
stage = "deck"
what = "The bond between {parts} ({area} mm^2) joins no nodes: those parts are not connected there."
explain = "A bonded connection was found between these parts, but when the model was built every mesh node on its face was already held by another connection, so this one joins nothing. The structure is solved without it, which can make it much more flexible than it is (a splice plate left loose, for example). It usually means a plate lies across several parts and one connection claimed the whole face."
likely_causes = ["A plate or face lies across several parts, and another connection took all of its nodes.", "The faces only meet along an edge already bonded by the faces beside it."]
actions = ["Click this message to see the parts in SolidWorks and check how they meet.", "Report the model: a connection that joins nothing is a defect in AsmFEA's connection building."]

[BOLT_NO_BEARING_FACE]
severity = "blocking"
stage = "deck"
what = "Preloaded bolt {bolt}: no bearing face found under the {end}."
explain = "A preloaded bolt clamps between the face under its head and the face under its nut. One of those could not be found where expected. Check the bolt's position and that a washer or nut sits on a part face."
likely_causes = ["The outer face of the clamped stack around the hole is not flat or not perpendicular to the bolt.", "The hole is countersunk or counterbored."]
actions = ["Use the default bolted mode for this joint (bonded), or model a flat bearing face."]

[CONTACT_NOT_CONVERGED]
severity = "blocking"
stage = "solve"
what = "The contact solution did not converge{detail}."
explain = "Contact problems are solved step by step, and the solver could not settle which faces touch. Common causes are parts that are not held in some direction, very small or distorted contact faces, or loads large enough to make parts slide off. Check the support of the parts in contact, or use a fixed connection where sliding is not needed."
likely_causes = ["A part is held only by contact and slides or lifts off freely.", "Contact opens and closes repeatedly (chattering) between increments.", "The load is larger than the joint can carry and something slips without limit."]
actions = ["Check the parts named here are restrained apart from the contact.", "Switch the contact pairs involved back to ties (decide: tie) to confirm the rest of the model.", "Reduce the load or add friction if sliding is expected to stop."]

[WELD_NO_INTERFACE]
severity = "info"
stage = "resolve"
what = "Weld bead {weld} on {parts} joins no touching faces within its size ({size:g} mm) of its path: ignored."
explain = "A weld bead is modelled by bonding the faces where the welded parts touch, within the bead size of the weld path. No touching faces were found near this one, so it is left out. Weld beads that join nothing are common and harmless (lettering or part numbers written in weld), so the run goes on (the user, 2026-10-18, D129). If the weld was meant to hold parts together, those parts are not joined by it: a part held by nothing else is reported as floating, which does stop the run."
likely_causes = ["The weld is not structural (lettering, part numbers, a tack mark).", "The welded parts do not touch at the weld (a gap, or a weld across a chamfer or root opening).", "The weld path was picked on an edge that is not where the parts meet."]
actions = ["Nothing, if the weld is not structural.", "If it should join the parts: make them touch where they are welded, or pick the weld path on the edge where they meet."]

[STAB_SPRING_LOAD]
severity = "warning"
stage = "post"
what = "Stabilising springs on {parts} carry {share:.1%} of the applied load in load case {case}."
explain = "Weak stabilising springs were added because some parts are held only by contact. They should carry almost nothing, but here they carry a significant share of the load, which means those parts are not actually held. The results for them are not reliable; add support or change the connection."
likely_causes = ["The part is not held by its contacts: they are open, or it slides."]
actions = ["Check the contact status of the part; add a restraint or a tie if it should be held."]

# --- extract: raised by the SolidWorks add-in, carried in model.json "issues" ---------

[STEP_EXPORT_FAILED]
severity = "blocking"
stage = "extract"
what = "SolidWorks could not export {file} (configuration {configuration}) to STEP: {error}."
explain = "SolidWorks could not write this part as a STEP file, so it cannot be meshed. The error is the one SolidWorks reported. Open the part and check it rebuilds without errors."
likely_causes = ["The part file is read-only or locked by another program.", "The study folder is not writable.", "The part has rebuild errors."]
actions = ["Fix any rebuild errors in the part, then export again.", "Check the study folder can be written to."]

[STEP_CONFIG_INACTIVE]
severity = "blocking"
stage = "extract"
what = "{file} is used in configuration {configuration}, but configuration {active} is active in the part; the add-in exports only the active configuration, so it did not export this one."
explain = "The assembly uses a configuration of this part that is not the part's active one. The add-in never changes your documents, so it does not switch configurations. Open the part, activate the named configuration, save, and export again."
likely_causes = ["The assembly uses a different configuration of the part from the one last activated in the part."]
actions = ["Open the part, activate the configuration named here, return to the assembly and export again."]

[MATE_ENTITY_UNMATCHED]
severity = "warning"
stage = "extract"
what = "Mate {mate} refers to {entity}, which could not be traced to a face of an exported part; the mate is exported without its faces."
explain = "A mate is exported as evidence of how parts are joined. One of its faces could not be traced to an exported part, so the mate is used without it. Connections are still found from touching faces; check the Connections tab."
likely_causes = ["The mate uses reference geometry (a plane, axis or point) or an edge.", "The mated component is suppressed or is a sub-assembly mate."]
actions = ["If the mate defines a joint, re-mate it to part faces.", "Otherwise ignore: contact between the parts is found from geometry."]

[MEMBER_PATH_UNKNOWN]
severity = "info"
stage = "extract"
what = "Structural member {part} has no straight axis the add-in could find; it is meshed with tets along its whole length."
explain = "Structural members are normally meshed with swept layers along their length, which is fast and accurate. No straight path could be found for this member, so it is meshed with tetrahedra along its whole length: slower, and stiffer in bending."
likely_causes = ["The member is curved or follows an arc or spline.", "The profile has no two non-parallel side faces."]
actions = ["No action needed unless the model is too large; straight members are meshed more efficiently."]

[EXTRACT_ITEM_FAILED]
severity = "blocking"
stage = "extract"
what = "The add-in could not read {item} ({step}): {error}. It is missing from the model."
explain = "The add-in could not read this item from SolidWorks, so it is missing from the exported model rather than guessed. The error comes from SolidWorks; rebuilding the assembly (Ctrl+Q) and exporting again often clears it."
likely_causes = ["A SolidWorks API call failed on this item (a rebuild error, an unusual feature or a damaged reference).", "A gap in the add-in for this kind of part or mate."]
actions = ["Rebuild the assembly (Ctrl+Q) and fix any rebuild errors, then export again.", "If it persists, report the item and the step named here."]

[FACE_REF_REMATCHED]
severity = "warning"
stage = "extract"
what = "Face {face} on {part} lost its SolidWorks reference after a change to the model and was found again by its shape (match score {score}). Check that the loads and fixtures on it are still where they should be."
explain = "Each load and fixture remembers its faces. After a change to the model SolidWorks could no longer identify this face, so it was found again by shape and position. The match is usually right, but check the load or fixture is still on the intended face (select it on the Loads tab to highlight it)."
likely_causes = ["A feature was deleted and recreated, or the face was split or merged, so SolidWorks gave it a new identity."]
actions = ["Select the study's loads and fixtures in the task pane to highlight their faces and confirm them.", "Re-select the face if it is wrong."]

[FACE_REF_LOST]
severity = "blocking"
stage = "extract"
what = "Face {face} on {part} could not be found after a change to the model: {reason}."
explain = "A face used by a load or fixture could not be found after a change to the model, for example because it was split or removed. The run stops rather than guess. Delete the load or fixture and add it again on the right faces."
likely_causes = ["The face was removed or reshaped by a design change.", "The face was split, so two faces now fit its old description."]
actions = ["Re-select the face for the loads and fixtures that use it, in the task pane.", "Undo the change if the face was removed by mistake."]

[FACE_REF_CHANGED]
severity = "warning"
stage = "extract"
what = "Face {face} on {part} changed size after a change to the model ({old_area} mm2 before, {new_area} mm2 now). Its loads and fixtures follow it; check that is what you intended."
explain = "A face used by a load or fixture changed size. The load or fixture follows the face; a force stays the same total force spread over the new area, while a pressure now acts over the new area. Check that is what you intended."
likely_causes = ["A dimension change resized the face.", "A feature cut into or added onto the face."]
actions = ["Select the loads and fixtures in the task pane to highlight their faces and confirm them.", "Re-select the face if the load should cover a different area."]

[SUPERPOSITION_NOT_USED]
severity = "info"
stage = "solve"
what = "Fast load-size changes is on, but each load case was solved as a whole: {reason}."
explain = "With Fast load-size changes each load is solved on its own once and a load case is the sum of its loads, so a later change to the size of loads needs no new solve. That is exact only when the results are linear in the loads. This study has something that is not, so its load cases were solved as a whole, as usual. The results are complete and correct; only the shortcut is not available."
likely_causes = ["The study includes buckling.", "The model has separating contact or preloaded bolts."]
actions = ["Nothing is needed. To use the shortcut, turn buckling off for this study, or use bonded connections."]

[RIGID_PART_UNKNOWN]
severity = "info"
stage = "load"
what = "Part {part} is set to rigid but is not in the model; the setting is ignored."
explain = "The study lists a part as rigid that this export does not contain (it may be suppressed in this configuration, renamed or deleted). The setting is kept and applies again if the part comes back; nothing else is affected."
likely_causes = ["The part is suppressed in the active configuration.", "The part was renamed or deleted after it was set to rigid."]
actions = ["Make the part flexible on the Connections tab (Rigid: row, Edit) if it is gone for good.", "Otherwise nothing is needed."]

[RIGID_NO_FLEXIBLE_PART]
severity = "blocking"
stage = "resolve"
what = "Every part is set to rigid ({parts}): there is nothing to analyse."
explain = "Rigid parts are not meshed and carry no stress; only the flexible parts are analysed. With every part rigid there is no structure left to solve."
likely_causes = ["The parts were made rigid by mistake.", "The one part meant to be analysed was made rigid as well."]
actions = ["Make the parts you want stresses for flexible on the Connections tab (Rigid: rows, Edit)."]

[RIGID_CONNECTION_UNSUPPORTED]
severity = "blocking"
stage = "resolve"
what = "Connection {connection} between {parts} is {kind}, which a rigid part cannot have."
explain = "A rigid part is not meshed: its connections join the other parts' faces to its rigid motion. Bonded, bolted (without preload) and hinged or sliding joints work that way. Separating contact needs a mesh on both sides, and a preloaded bolt needs one under its head and nut, so these are not available on a rigid part; two rigid parts meeting face to face are one rigid body and cannot slide on each other."
likely_causes = ["A part with separating contact or a preloaded bolt was made rigid.", "Two rigid parts were set to slide on each other."]
actions = ["Set the connection to Fixed or to Sliding, no separation (Connections tab, Set to).", "Or make the part flexible again."]

[RIGID_JOINT_IN_GROUP]
severity = "info"
stage = "resolve"
what = "Joint {connection} between rigid parts {parts} is ignored: they are also bonded, so they move as one rigid body."
explain = "Rigid parts bonded to each other form one rigid body. A hinge or sliding joint between two parts of one such body can never move, so it is left out; the bond holds them."
likely_causes = ["Two rigid parts touch face to face (bonded) and are also hinged.", "A hinge was added between parts that are welded or bolted together."]
actions = ["Nothing is needed if the parts are meant to be fixed together.", "If the joint should move, set the bond between them to Not connected, or make one of the parts flexible."]

[JOIN_INVALID]
severity = "blocking"
stage = "resolve"
what = "Join {join} cannot be made: {problem}."
explain = "A join you add connects two different parts, and any faces chosen for it must be faces of those parts, at most one on each. The faces or parts of this join do not allow that, so it is left out until it is fixed."
likely_causes = ["A face of a third part was selected.", "Both faces are on one part.", "A part was removed or a face changed in SolidWorks since the join was added."]
actions = ["Delete the join on the Connections tab (Set to: Not connected) and add it again, selecting the two parts or a face on each."]

[JOIN_TOO_FAR]
severity = "warning"
stage = "resolve"
what = "Join {join} between {parts} was not made: the nearest faces are {gap} mm apart, more than the join limit of {limit} mm."
explain = "A join with no faces chosen, or with a face chosen on one part only, bonds the nearest faces only when they are close (about one element apart): further apart, a bond would join faces that may not be the ones meant. Choose a face on each part to join them however far apart they are (they are then joined by a rigid link)."
likely_causes = ["The parts do not come close to each other where they should meet.", "The selected face is not the one nearest the other part."]
actions = ["Select a face on each part and press Join again: the two faces are linked whatever the distance.", "Or move the part in SolidWorks so that it meets its neighbour."]

[JOIN_TYPE_UNSUPPORTED]
severity = "blocking"
stage = "resolve"
what = "Join {connection} between {parts} is a rigid link and cannot be set to {kind}."
explain = "A join between faces that do not meet is made as a rigid link: each face's mean motion follows one rigid connector between them. A link carries everything (Fixed); contact or sliding needs faces that touch."
likely_causes = ["A join between faces that are apart was set to a sliding or contact type."]
actions = ["Set the join back to Fixed, or delete it and join faces that touch."]

[HYBRID_RIGID_UNSUPPORTED]
severity = "info"
stage = "solve"
what = "The memory-saving solver cannot take {what} yet: the model was solved with CalculiX instead."
explain = "The run planner chose the memory-saving (hybrid) solver for this model's size, but it does not yet support this combination of rigid parts or rigid links. CalculiX solved it instead; the results are complete, but the solve needed more memory."
likely_causes = ["A rigid part with a joint or a fixture combination the hybrid solver does not handle."]
actions = ["Nothing is needed if the solve finished.", "If memory runs short, make the rigid parts flexible or simplify the joints on them."]

[FATIGUE_NO_SN_CURVE]
severity = "blocking"
stage = "fatigue"
what = "Material {material} has no S-N data for the fatigue assessment."
explain = "Fatigue life is read from an S-N curve, and asmfea never assumes one: each material of the parts assessed needs a curve of its own (a Basquin fit or S-N points from your data), or a parent-material class of the study's standard."
likely_causes = ["The material was added to the model after the fatigue settings were made.", "The material's name in the fatigue settings is spelled differently from the model's."]
actions = ["Add the material to the fatigue settings with its S-N data (study.fatigue.materials: basquin, points or standard_class) and its source."]

[FATIGUE_CLASS_UNKNOWN]
severity = "blocking"
stage = "fatigue"
what = "Material {material}: class {cls} is not a parent-material class of {standard}."
explain = "A standard_class picks the standard's own S-N curve for unwelded material. Each standard offers only a few; a class from another standard, or a misspelt one, cannot be used."
likely_causes = ["The class belongs to another standard than the one chosen for the study.", "The class name is misspelt."]
actions = ["Choose one of the classes listed in the evidence, or change the study's standard, or give a curve of your own (basquin or points)."]

[FATIGUE_NO_ULTIMATE]
severity = "blocking"
stage = "fatigue"
what = "Material {material} has no ultimate strength, which the {rule} mean-stress correction needs."
explain = "A user S-N curve is for fully reversed loading; a cycle with a mean stress is corrected to an equivalent fully reversed amplitude using the material's ultimate tensile strength. Without it the correction cannot be made."
likely_causes = ["The material in SolidWorks has no tensile strength set."]
actions = ["Set the material's tensile strength in SolidWorks and export again.", "Or set study.fatigue.parent.mean_stress to none if your S-N data already allows for the mean stress (state why in the report)."]

[FATIGUE_UNKNOWN_CASE]
severity = "blocking"
stage = "fatigue"
what = "Fatigue spectrum row {row} names load case {case}, which is not one of the study's load cases."
explain = "Each row of the spectrum cycles a solved load case between two percentages. A row naming a load case the study does not solve has no stresses to read."
likely_causes = ["The load case was renamed or removed after the spectrum was set up.", "The case is not in study.load_cases (it is not solved)."]
actions = ["Correct the row's case, or add the load case to the study and run it."]

[FATIGUE_NONLINEAR_LEVEL]
severity = "blocking"
stage = "fatigue"
what = "Fatigue spectrum row {row} uses load case {case} at {pct:g} %, but that case has contact or preloaded bolts, so it cannot be scaled."
explain = "With contact or preloaded bolts the response is not proportional to the load (a joint opens, a bolt's force jumps), so a result at 100 % cannot be scaled to another level. Only 0 % (unloaded, or the bolts' preload alone) and 100 % of such a case can be read."
likely_causes = ["The row's percentage is neither 0 nor 100 on a case solved with contact or preload."]
actions = ["Add a load case at that load level, solve it, and use it at 100 % in the row."]

[FATIGUE_NONLINEAR_PAIR]
severity = "info"
stage = "fatigue"
what = "Fatigue spectrum rows use load cases with contact or preloaded bolts ({cases}): their ranges are taken between separately solved cases."
explain = "Each such case was solved on its own. The range between two of them is valid as it stands; the cases are not scaled. A case's 0 % state is its own unloaded state (with the bolts' preload alone where there are preloaded bolts)."
likely_causes = ["The study has contact or preloaded bolts."]
actions = ["No action needed. To read a level other than 0 % or 100 % of such a case, solve that level as a load case of its own."]

[FATIGUE_HOTSPOT_UNCONVERGED]
severity = "warning"
stage = "fatigue"
what = "Part {part}: its largest stress range changed {change:+.1f} % between the last two meshes (limit {tol:g} %); its fatigue life is not settled."
explain = "Fatigue life goes roughly as the stress range to the power 3 to 10, so a few per cent in stress is tens of per cent in life. The governing range must hold between the last two meshes; this one did not."
likely_causes = ["A notch (fillet, hole or corner) is not meshed finely enough yet.", "The governing point is near a joint or support edge whose stress has no finite value."]
actions = ["Run with Optimise for Accuracy (or fidelity fine), which refines the parts that did not converge.", "Look at where the governing point is: at an unfilleted corner, model the real fillet radius."]

[FATIGUE_SHARP_NOTCH]
severity = "warning"
stage = "fatigue"
what = "Part {part}: the highest fatigue damage is at a sharp inside corner (at {at}), which has no finite stress; the corner is left out and the next point is reported."
explain = "At an inside corner with no fillet the elastic stress grows without limit as the mesh is refined, so no fatigue life can be read there. The real part has some radius at the corner; its life depends on that radius."
likely_causes = ["The corner is modelled sharp, with no fillet.", "A weld or a machined pocket corner is modelled without its radius."]
actions = ["Model the corner's real radius (a fillet), or assess the corner by hand with a detail category or a notch factor for its real radius."]

[FATIGUE_NO_CATEGORY]
severity = "blocking"
stage = "fatigue"
what = "Joint {connection} is to be assessed by its nominal stress, but has no detail category."
explain = "The nominal stress method reads a joint's life from the detail category of the joint's type in the standard (a curve per type of weld detail). asmfea cannot tell a joint's detail from the model, so the category must be given for each joint assessed this way."
likely_causes = ["The joint is set to the nominal method, or the study's weld method is nominal, but no category was given for it."]
actions = ["Give the joint's detail category in study.fatigue.welds.joints, or assess it by the structural stress method (dong), which needs no category."]

[FATIGUE_CATEGORY_WRONG_STANDARD]
severity = "blocking"
stage = "fatigue"
what = "Joint {connection}: category {category} is not one of {standard}'s."
explain = "One standard is used for the whole study, and each joint's category must be one of that standard's (for the structural stress method, one of its structural stress curves)."
likely_causes = ["The category belongs to another standard than the one chosen for the study.", "The category is misspelt."]
actions = ["Choose one of the categories listed in the evidence, or change the study's standard."]

[FATIGUE_RECEIVING_SIDE_NOT_ASSESSED]
severity = "warning"
stage = "fatigue"
what = "Joint {connection}: the wall it sits on ({part}) is not assessed for fatigue; only the member side of the joint is."
explain = "A bonded joint can crack on either side of the weld: in the member whose end or edge is welded, or in the wall it is welded onto. The wall is assessed by the published hand formulae where the joint is a hollow-section T-joint inside their range, else read from the model as an indication; for this joint neither was possible (the wall's thickness or the stresses round the joint could not be read)."
likely_causes = ["The receiving part is a solid with no wall thickness.", "The joint's footprint could not be traced on the receiving part's mesh."]
actions = ["Check the receiving wall by hand (for tube joints, CIDECT design guide 8 or EN 1993-1-9 Table 8.7), or by a local model with the weld."]

[FATIGUE_RECEIVING_SIDE_INDICATIVE]
severity = "info"
stage = "fatigue"
what = "Joint {connection}: the wall it sits on ({part}) is assessed from the model's hot-spot stress, an indication only ({why})."
explain = "The published hand formulae for the wall a tube is welded onto cover square and rectangular hollow-section T-joints inside a range, under axial load and in-plane bending. This joint is not one of those, so the wall's hot-spot stress is read from the bonded model at 0.4 and 1.0 wall thicknesses from the joint's edge. On a reference joint that read-out came out anywhere from 40 % low (coarse meshes) to 30 % high against a solid model and the formulae, so it is an indication, not an assessment."
likely_causes = ["The joint is not a square-on hollow-section T-joint, or is outside the formulae's range.", "The brace carries out-of-plane bending, for which no formula is published."]
actions = ["Treat the wall's figure as indicative: use the refined (or Optimise for Accuracy) results, and check by hand or a local model with the weld where it matters."]

[FATIGUE_BOLT_NOT_ASSESSED]
severity = "info"
stage = "fatigue"
what = "{count} bolted joint(s) in the default mode (clamped faces bonded, no bolt in the model) have no bolt force, so their bolts are not assessed for fatigue."
explain = "In the default bolted mode the clamped faces are bonded and the fastener is left out, so the model carries no bolt force. A bolt is assessed for fatigue only in the preloaded mode, where it is an element of its own and its force is solved in every load case with the preload in place."
likely_causes = ["The joints are in the default bolted mode."]
actions = ["Switch the joints whose bolts matter to the preloaded mode (contact and preload), or check the bolts by hand."]
